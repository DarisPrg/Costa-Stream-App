name: Costa Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Costa Stream APK (stable debug)
        run: ./gradlew assembleStableDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CostaStream-APK
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
